<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEADPOOL landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="hero">
        <div class="card">
            <div class="navbar">
                <img src="deadpool-logo.png" alt="deadpool-logo" class="nav-logo">
                <ul class="nav-links">
                    <li>About</li>
                    <li>Get tickets</li>
                    <li>Videos</li>
                    <li>Share</li>
                </ul>
            </div>

            <div class="left-panel">
                <p class="tag">#1 MOVIE IN THE WORLD</p>
                <h1>
                    WATCH NEW <br>
                    <span>DEADPOOL 2</span> <br>
                    ONLINE
                </h1>
                <button class="btn">BUY ACCESS</button>
            </div>

            <div class="main-img">
                <img src="deadpool.png" alt="deadpool-img" class="deadpool-img">
            </div>

            <div class="right-panel">
                <div class="top-card">
                    <div class="content-row">
                        <div class="text">
                            <p class="studio">20TH CENTURY FOX</p>
                            <h4>Behind the scence : Deadpool's Iconic GunFight Moment</h4>
                        </div>
                        <img src="deadpool1.jpg" class="thumb-right-img">
                    </div>
                </div>
                       <div class="top-card">
                        <div class="stats-row">
                            <img src="deadpool2.jpg" class="thumb-left-img">
                            <div class="stats">
                                <h2>32,556,546</h2>
                                <p class="views">VIEWERS</p>
                                <div class="ration">
                                    <span class="stars"> ★ ★ ★ ★ ★</span>
                                    <span>4.9</span>
                                </div>
                                <p class="more">MORE</p>
                            </div>
                        </div>
                    </div>
            </div>
        </div>
    </section>
</body>
</html>
